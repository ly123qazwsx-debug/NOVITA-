name: NOVITA Daily Cost Report

on:
  schedule:
# 每天北京时间 11:10 = UTC 03:10（用户 11:00 更新表，留 10 分钟缓冲）
    - cron: "10 3 * * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Create config
        run: cp config.example.yaml config.yaml

      - name: Generate report and push to Feishu
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
          FEISHU_RECEIVE_ID_TYPE: ${{ secrets.FEISHU_RECEIVE_ID_TYPE }}
        run: python3 main.py

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novita-report-${{ github.run_id }}
          path: output/
          retention-days: 90
