# 飞书应用凭证 — 在 https://open.feishu.cn/app 创建企业自建应用后获取
# 也可通过环境变量 FEISHU_APP_ID / FEISHU_APP_SECRET 注入，不必写进本文件
feishu:
  app_id: "cli_xxxxxxxxxx"
  app_secret: "xxxxxxxxxxxxxxxxxxxxxxxx"

# 数据源：飞书 Wiki 内嵌电子表格
# https://dreamonvip.feishu.cn/wiki/AbzbwxIJiiyxIAkMFkKcRHJZnKG
data_source:
  wiki_token: "AbzbwxIJiiyxIAkMFkKcRHJZnKG"
  sheet_name: "NOVITA"
  sheet_id: "v9euzu"
  range: "A1:Z400"

# AWS 工作表（同一 Wiki 文档内）
aws:
  data_source:
    wiki_token: "AbzbwxIJiiyxIAkMFkKcRHJZnKG"
    sheet_name: "AWS"
    range: "A1:Z400"
  insights:
    watch_services:
      - key: elb
        label: "ELB 负载均衡"
        rise_since_day: 15
        note: "重点检查 prod-api-ecs 是否存在闲置资源、请求量增加或配置重复"
      - key: s3
        label: "S3"
        rise_since_day: 15
        note: "重点检查 digen-asset、liveme-process、liveme-pic 的存储增长、文件上传、请求和流量情况。"

# 列按 NOVITA 表固定顺序解析：
# A年 B月 C日(8月1日) D LLM  E sd  F GPU (按需)  G GPU (按需存储)  H GPU 固定

report:
  currency: "USD"
  currency_symbol: "$"
  timezone: "Asia/Shanghai"
  output_dir: "output"
  # as_of: "2026-08-26"   # 可选；不填则自动取表内汇总标注或当月最新明细日（不超过昨天）

# 每月可改的人工备注，会写进日报「其中」
insights:
  extra_notes:
    - "机器本月新加12台：5090普*3台、4090*9台"

push:
  enabled: true
  webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/xxxxxxxx"
  webhook_secret: ""
  # 可选：通过应用发到指定会话（需 im:message 权限）
  receive_id: ""
  receive_id_type: "chat_id"   # chat_id | open_id | email
